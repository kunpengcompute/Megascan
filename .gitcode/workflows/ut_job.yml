name: UT Job

on:
  workflow_call:
    inputs:
      runs_on_flavor:
        required: true
        type: string
      docker_img:
        required: true
        type: string
      pr_id:
        required: true
        type: string
      default_branch:
        required: true
        type: string

jobs:
  JOB_Compile:
    name: UT
    select: selected_by_default
    runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, "${{ inputs.runs_on_flavor }}" ]
    container:
      image: ${{ inputs.docker_img }}
    steps:
      - name: fast_checkout
        identifier: fast_checkout
        uses: checkout
        with:
          # fork PR 预合并引用会被安全拦截，需显式放行
          allow-unsafe-pr-checkout: true
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge
      - name: checkout_default_scripts
        uses: checkout
        with:
          ref: ${{ inputs.default_branch }}
          path: base-scripts
      - name: init_script
        run: cp -rf base-scripts/.gitcode/. .gitcode/
      - name: download build artifacts
        uses: download-artifact
        with:
          name: megascan-build
          path: output/
      - name: ut
        run: sh .gitcode/scripts/ut_ci.sh
