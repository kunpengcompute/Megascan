name: PR-Pipeline_Megascan

on: # 自动触发工作流运行的触发条件
  #workflow_dispatch:            # 界面手动运行
  pull_request_target:           # MR 事件触发默认分支配置文件
    types: ["open", "reopen", "update"]
    branches: [ "*" ]
  pr_comment:                    # PR 评论触发
    types: [ created ]
    keyword: '^(?:\/)?compile*'
  pull_request_comment:          # 标准 PR 评论触发事件
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' , 'sca-pr-scan' ]

concurrency: # 并发控制
  enable: true             # 启用并发控制
  max: 3                   # 最大并发运行数（范围1-5）
  exceed-action: QUEUE     # 超出并发上限时排队等待
  preemption:              # 抢占策略：新事件取消同组正在运行的旧运行
    enable: true           # 启用抢占
    events: [mr_id]        # 按MR隔离：同一MR的新推送取消该MR的旧运行

permissions:
  repository: read      # 主文件顶层只声明基础读权限
  pr: read              # 供作业读取PR元数据（只读）

env:
  pr_id: ${{ atomgit.event.pull_request.number }}
  branch: ${{ atomgit.event.pull_request.base.ref }}

stages: #阶段，不超过16个阶段，不超过256个job
  stage0: # 流水线状态管理（非项目逻辑）
    name: 初始化阶段
    select: selected_by_default
    jobs:
      associate_pr_comment:
        name: associate_pr_comment
        runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=small ]
        steps:
          - name: associate_pr_comment
            uses: associate-pr-comment
      init_pipeline_status:
        name: init_pipeline_status
        runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=small ]
        steps:
          - name: Set running label
            uses: openlibing/pr-label-action@v1.0.0
            with:
              add_labels: ci-pipeline-running
              remove_labels: ci-pipeline-passed,ci-pipeline-failed
              token: ${{ secrets.PR_LABEL_TOKEN }}

  stage1: # 校验阶段
    name: 校验阶段
    select: selected_by_default
    jobs:
      sca-pr:
        name: sca-pr
        runs-on: ["ubuntu-latest", "x64", "slim" ]
        permissions:
          id-token: write   # 仅本作业需要OIDC令牌
        steps:
          - name: sca-pr
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: "boostkit"

      antipoison-scan:
        name: antipoison-scan
        runs-on: ["ubuntu-latest", "x64", "slim"]
        permissions:
          id-token: write   # 仅本作业需要OIDC令牌
        steps:
          - name: malicious-scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              project-name: "boostkit"

      pre-commit: # 仓库根目录存在 .pre-commit-config.yaml，作业已启用
        name: pre-commit
        runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=small ]
        steps:
          - name: Checkout
            uses: checkout
            with:
            # fork PR 预合并引用会被安全拦截，需显式放行
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
          - name: Configure GitHub proxy
            run: git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"
          - name: Setup Python
            uses: setup-python
            with:
              python-version: "3.14"
          - name: Setup Go        # Go hook（golangci-lint）需要 Go 环境
            uses: setup-go
            with:
              go-version: '1.26.1'   # 版本号必须带引号，否则 YAML 解析成 1.2
          - name: install gitleaks   # 预装 gitleaks 二进制（hook 依赖本机可执行文件）
            run: |
              export GO111MODULE=on
              export GOPROXY=https://mirrors.huaweicloud.com/repository/goproxy/
              export GONOSUMDB=*
              cd ${ATOMGIT_WORKSPACE}
              wget --no-host-directories -c --no-check-certificate https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/gitleaks
              chmod +x gitleaks
              cd -
          - name: Run pre-commit
            uses: openlibing/pre-commit-action@v1.0.0
            # 自动模式：PR 事件检查 PR 增量文件，非 PR 事件全量检查

post:
  jobs:
    update_pipeline_status:
      name: update_pipeline_status
      runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=small ]
      steps:
        - name: Set result label
          uses: openlibing/pr-label-action@v1.0.0
          with:
            add_labels: ${{ pipeline.upstream_status == 'COMPLETED' && 'ci-pipeline-passed' || 'ci-pipeline-failed' }}
            remove_labels: ci-pipeline-running,${{ pipeline.upstream_status == 'COMPLETED' && 'ci-pipeline-failed' || 'ci-pipeline-passed' }}
            token: ${{ secrets.PR_LABEL_TOKEN }}
